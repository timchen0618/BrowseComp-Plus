# GRPO training config for Qwen3.5-4B explorer.
# All paths are relative to the BrowseComp-Plus project root.
# Pass to any script with --config rl/trl/config.yaml.

# === Paths ===
sft_checkpoint: sft/checkpoints/PLACEHOLDER
index_path: "indexes/Qwen3-Embedding-8B/*"
index_model_name: Qwen/Qwen3-Embedding-8B
train_queries: topics-qrels/bcp/queries_train680.tsv
ground_truth: data/browsecomp_plus_decrypted_train680.jsonl
output_dir: rl/trl/runs/grpo_run1

# === GPU / Server ports ===
main_agent_port: 8010    # GPU 2: GPT-OSS-120B, always loaded
rollout_port: 8011       # GPU 3: Qwen3.5-4B explorer / Qwen3-32B judge (time-muxed)

# === Models ===
explorer_model: Qwen/Qwen3.5-4B
main_agent_model: openai/gpt-oss-120b
judge_model: Qwen/Qwen3-32B

# === GRPO hyperparameters ===
group_size: 4             # G — independent trajectories per query
batch_queries: 32         # queries per rollout iteration  -> 128 samples/iter
kl_beta: 0.01             # KL penalty coefficient beta
learning_rate: 1.0e-5
max_steps: 500
checkpoint_every: 20      # learner steps between weight-sync checkpoints
min_buffer_size: 64       # learner blocks until buffer holds this many samples

# === Reward function ===
# 'llm_judge' — Qwen3-32B judge on GPU 3 (time-muxed with explorer)
# 'sub_em'    — substring exact match; no judge server needed, saves GPU memory
reward_function: llm_judge

# === Rollout settings ===
max_turns: 15             # max LLM calls per explorer trajectory
main_agent_max_turns: 10  # max LLM calls for main agent (usually 1-2 with trajectory context)
max_new_tokens: 2048      # max tokens per LLM call
temperature: 0.6
top_p: 0.95
k: 5                      # search results returned per query
snippet_max_chars: 2000   # truncate each search result text to this many chars (~500 tokens)
max_input_chars: 80000    # stop explorer early if accumulated context exceeds this (~20K tokens)

# === Logging ===
wandb_project: browsecomp-rl
wandb_run_name: grpo_run1
log_example_every: 10     # print one example trajectory every N daemon iterations

# === Buffer / checkpoint paths ===
buffer_dir: rl/trl/tmp/rl_buffer
ckpt_dir: rl/trl/tmp/rl_buffer/ckpt_latest
ckpt_flag: rl/trl/tmp/rl_buffer/ckpt_ready.flag
